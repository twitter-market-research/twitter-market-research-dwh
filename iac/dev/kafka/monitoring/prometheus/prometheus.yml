# Global configuration for Prometheus
# This file defines the global settings, alerting rules, and scrape configurations for Prometheus to monitor Kafka brokers and custom metrics from a Python producer.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "kafka-broker-1"
    static_configs:
      - targets: ["broker-1:7071"]

  - job_name: "kafka-broker-2"
    static_configs:
      - targets: ["broker-2:7072"]

  - job_name: "kafka-broker-3"
    static_configs:
      - targets: ["broker-3:7073"]

  - job_name: "kafka-producer-tweets-raw"
    static_configs:
      - targets: ["tweets-raw-producer:8000"]  # métriques Python custom
