services:

  # ─────────────────────────────────────────────────────────────────
  # MinIO — stockage objet S3-compatible (backup raw tweets)
  # Console : http://localhost:9001
  # ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      # bash /dev/tcp — aucun outil externe requis (curl/wget/grep absents de l'image)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - twitter-research-network

  minio-init:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/tweets-raw &&
      echo 'Bucket tweets-raw pret.'
      "
    networks:
      - twitter-research-network

  # ─────────────────────────────────────────────────────────────────
  # Kafka Connect — S3 Sink : tweets_raw → MinIO
  # REST API : http://localhost:8083
  # ─────────────────────────────────────────────────────────────────
  kafka-connect:
    build:
      context: ./kafka-connect
    container_name: kafka-connect
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker-1:29092,broker-2:29092,broker-3:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "connect-group-storage"
      CONNECT_CONFIG_STORAGE_TOPIC: "__connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "__connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "__connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      # Credentials MinIO (compatibles AWS SDK)
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - twitter-research-network

  # Enregistre le connecteur S3 Sink une fois Kafka Connect prêt
  connect-init:
    image: curlimages/curl:8.5.0
    container_name: connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./kafka-connect/connectors:/connectors:ro
    entrypoint: >
      /bin/sh -c "
      STATUS=$$(curl -s -o /dev/null -w '%{http_code}' http://kafka-connect:8083/connectors/s3-sink-tweets-raw);
      if [ \"$$STATUS\" = '200' ]; then
        echo 'Connector s3-sink-tweets-raw deja enregistre.';
      else
        echo 'Enregistrement du connector s3-sink-tweets-raw...';
        curl -X POST http://kafka-connect:8083/connectors -H 'Content-Type: application/json' -d @/connectors/s3-sink-tweets-raw.json && echo 'Connector enregistre avec succes.';
      fi
      "
    networks:
      - twitter-research-network

volumes:
  minio-data:
    driver: local


