server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Même origine que la page : l'émulateur n'émet pas d'en-têtes CORS,
    # le navigateur ne peut l'atteindre que par ce chemin. Ses routes
    # commencent déjà par /bigquery/, donc le préfixe est conservé tel quel.
    location /bigquery/ {
        proxy_pass http://bq-emulator:9050;
    }
}
