name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]


jobs:
  governance:
    name: Data governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - run: python -m pip install --upgrade pip pytest pyyaml

      # Job séparé, sans Java ni pyspark: la governance reste vérifée
      # meme quand la suite spark casse
      - run: make governance
    
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      
      - run: make install
      - run: make test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Valide les constants de build declarés dans le compose
      - run: make build-verify
      - run: make version-bump

      # La version n'existe qu'après le bump
      - id: version
        run: echo "tag=v$(cat VERSION)" >> "GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - run: gcloud auth configure-docker europe-west1-docker.pkg
      - run: make images-push VERSION_TAG=${{ steps.version.outputs.tag }}

      - run: git push --follow-tags



  

  