name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]


jobs:
  governance:
    name: Data governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - run: python -m pip install --upgrade pip pytest pyyaml

      # Job séparé, sans Java ni pyspark: la governance reste vérifée
      # meme quand la suite spark casse
      - run: make governance
  
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip flake8
      - run: make lint
  
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks lit tout l'historique
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip bandit pip-audit
      - run: make security


  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      
      - run: make install
      - run: make test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Valide les constants de build declarés dans le compose
      - run: make build-verify

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [tests, governance, build, lint, security]

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'bump:')
      
    permissions:
      contents: write   # le commit de bump et son tag
      id-token: write   # jeton OIDC reclame par WIF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 #cz a besoin de tout l'historique

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip commitizen

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Bump version
        run: make version-bump

      # La version n'existe qu'après le bump
      - id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # Publication des images : conditionnee a GCP_PROJECT_ID, que l'on
      # declare le jour ou Artifact Registry existe. Tant que la variable est
      # absente ces cinq etapes sont ignorees, et la CI reste verte sans que
      # le cablage WIF ait besoin d'etre recommente.
      #
      # Aucune cle de compte de service : le runner echange son jeton OIDC
      # contre un jeton Google de courte duree. L'identite ci-push-dwh n'est
      # empruntable que par un push sur main de CE depot.
      - uses: google-github-actions/auth@v2
        if: vars.GCP_PROJECT_ID != ''
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: vars.GCP_PROJECT_ID != ''
      - if: vars.GCP_PROJECT_ID != ''
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # Les images du job Build vivaient sur un autre runner : images-push
      # depend de build, qui les reconstruit ici avant de les pousser.
      - uses: docker/setup-buildx-action@v3
        if: vars.GCP_PROJECT_ID != ''
      - name: Push images
        if: vars.GCP_PROJECT_ID != ''
        run: make images-push VERSION_TAG=${{ steps.version.outputs.tag }}
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      # Le tag n'atteint le depot qu'une fois les images publiees : si le push
      # echoue, aucune version n'est annoncee.
      - run: git push --follow-tags

  




  

  